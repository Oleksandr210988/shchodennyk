<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Щоденник</title>
<meta name="theme-color" content="#2f6f4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Щоденник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--food:#2f6f4f;--gym:#1f5fbf;--watch:#8a4fbf;--fg:#1c2220;--bar:#fff;--line:#dbe1de;--muted:#5f6a65;--bg:#f3f5f2}
@media (prefers-color-scheme:dark){:root{--food:#7cc39c;--gym:#5b97ec;--watch:#c39cf0;--fg:#e7ece9;--bar:#1d2321;--line:#2d3532;--muted:#9ba6a1;--bg:#141817;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
#frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
nav{display:flex;background:var(--bar);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 10px;border:0;background:none;color:var(--muted);font:600 13px/1.2 inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav button svg{width:26px;height:26px}
nav button[aria-pressed="true"][data-tab="food"]{color:var(--food)}
nav button[aria-pressed="true"][data-tab="gym"]{color:var(--gym)}
nav button[aria-pressed="true"][data-tab="watch"]{color:var(--watch)}
#v-watch{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-left,0px)) 24px;color:var(--fg)}
#v-watch .wrap{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
#v-watch .wrap>*{min-width:0}
#v-watch h1{font-size:20px;margin:0}
#v-watch h2{font-size:15px;margin:0 0 6px}
#v-watch summary{cursor:pointer;padding:2px 0}
#v-watch details[open] summary{margin-bottom:8px}
.card{background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:12px}
.card p{margin:0 0 8px;color:var(--muted);line-height:1.45}
.card p:last-child{margin-bottom:0}
.btn{display:block;width:100%;min-height:44px;border-radius:12px;border:0;background:var(--watch);color:#fff;font:700 16px inherit;cursor:pointer;margin-top:8px}
.btn.sec{background:none;color:var(--fg);border:1px solid var(--line);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat>span{display:block}
.stat span,.stat b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.wide{grid-column:1/-1}
.stat{background:var(--bg);border-radius:10px;padding:7px 8px;min-width:0}
.stat b{display:block;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat.wide b{font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--watch)}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 3px;font-size:13px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;width:32%}
th,td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
.wo{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.wo:last-child{border-bottom:0}
.wo small{display:block;color:var(--muted)}
.wo .r{text-align:right;white-space:nowrap}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px;font:13px monospace}
.ok{color:var(--food);font-weight:600}
.err{color:#c0392b;font-weight:600}
nav button[aria-pressed="true"] span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
</style></head><body>
<div id="frames">
  <iframe id="f-food" title="Калорії" allow="camera; clipboard-write" hidden></iframe>
  <iframe id="f-gym" title="Тренування" allow="camera; clipboard-write" hidden></iframe>
  <section id="v-watch" hidden aria-label="Годинник"><div class="wrap" id="watchBody"></div></section>
</div>
<nav aria-label="Розділи">
  <button type="button" data-tab="food" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2.5"/><path d="M3 4v6M3 10v10M21 4v16"/></svg><span>Калорії</span></button>
  <button type="button" data-tab="gym" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 12h10M5 7v10M8 8v8M16 8v8M19 7v10M2 10v4M22 10v4"/></svg><span>Тренування</span></button>
  <button type="button" data-tab="watch" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="4"/><path d="M9 6l1-4h4l1 4M9 18l1 4h4l1-4M12 9v3l2 1"/></svg><span>Годинник</span></button>
</nav>
<script src="watch.js"></script>
</body></html>
