name: Android APK
on:
  push:
    branches: [main]
    paths: ["index.html", "watch.js", "food/**", "gym/**", "android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Web files into the app
        working-directory: android-app
        run: npm ci && npm run sync
      - name: Signing key from repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks; echo "SIGNED=1" >> $GITHUB_ENV; else echo "No signing key yet: test build only"; fi
      - name: Build APK
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: ${{ env.SIGNED && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: shchodennyk
          KEY_ALIAS: shchodennyk
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease --stacktrace && cp app/build/outputs/apk/release/app-release.apk $GITHUB_WORKSPACE/shchodennyk.apk
      - name: Check APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging shchodennyk.apk | grep -E "package:|sdkVersion|application-label"
          $AAPT dump permissions shchodennyk.apk
          unzip -l shchodennyk.apk | grep -E "assets/public/(index.html|watch.js|privacypolicy.html|food/index.html|gym/index.html)|capacitor.plugins.json"
          unzip -p shchodennyk.apk assets/capacitor.plugins.json
          $(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1) verify --print-certs shchodennyk.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: shchodennyk-apk
          path: shchodennyk.apk
      - name: Publish for download
        if: env.SIGNED
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Щоденник для Android" --notes "Остання версія застосунку. Завантажте shchodennyk.apk на телефоні і встановіть."
          gh release upload apk shchodennyk.apk --clobber
          gh release edit apk --notes "Остання версія застосунку (збірка ${{ github.run_number }}). Завантажте shchodennyk.apk на телефоні і встановіть."
