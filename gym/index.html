<script>/* Local on-device store with the same small API the diary pages use (collection/doc, set, delete, onSnapshot). Data stays on this phone. */
(function(){
  const KEY = "shchodennyk-db-" + (document.documentElement.dataset.app || "app");
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const colSubs = {}, docSubs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { alertQuota(); } };
  function alertQuota(){ const s = document.getElementById("status"); if (s) s.textContent = "Пам'ять телефона переповнена"; }
  const clone = o => JSON.parse(JSON.stringify(o));
  const colOf = path => path.split("/").slice(0, -1).join("/");
  const snapCol = c => ({docs: Object.keys(store).filter(p => colOf(p) === c).map(p => ({id: p.split("/").pop(), exists: true, data: () => clone(store[p])}))});
  const snapDoc = p => ({id: p.split("/").pop(), exists: p in store, data: () => p in store ? clone(store[p]) : undefined});
  function notify(path){
    const c = colOf(path);
    (colSubs[c] || []).forEach(cb => setTimeout(() => cb(snapCol(c)), 0));
    (docSubs[path] || []).forEach(cb => setTimeout(() => cb(snapDoc(path)), 0));
  }
  function docRef(path){
    return {
      set: async data => { store[path] = clone(data); save(); notify(path); },
      delete: async () => { delete store[path]; save(); notify(path); },
      get: async () => snapDoc(path),
      onSnapshot: cb => { (docSubs[path] = docSubs[path] || []).push(cb); setTimeout(() => cb(snapDoc(path)), 0); return () => {}; }
    };
  }
  const DB = {
    doc: path => docRef(path),
    collection: c => ({
      doc: id => docRef(c + "/" + id),
      onSnapshot: cb => { (colSubs[c] = colSubs[c] || []).push(cb); setTimeout(() => cb(snapCol(c)), 0); return () => {}; }
    })
  };
  window.APPDB = {
    importDocs: async docs => { let n = 0; Object.entries(docs).forEach(([p, d]) => { if (p && d && typeof d === "object") { store[p] = clone(d); n++; } }); save(); return n; },
    count: () => Object.keys(store).length
  };
  window.claude = {use: async name => name === "db" ? DB : null};
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>

<script>
// day = workout type (kept as "day" in saved data): 1..5 strength, 6 bike
const DAYS = {
  1:{t:"Груди + трицепс", g:["Груди","Трицепс"]},
  2:{t:"Ноги + біцепс", g:["Ноги","Біцепс"]},
  3:{t:"Спина + плечі", g:["Спина","Плечі"]},
  4:{t:"Біцепс + трицепс", g:["Біцепс","Трицепс"]},
  5:{t:"Задня частина ніг + литки", g:["Задня поверхня стегна і сідниці","Литки"]},
  6:{t:"Велосипед", g:[]},
  7:{t:"Інше тренування", g:["Вправи"]}
};

let cur = null;          // open workout, or null on the start screen
let openKey = null, showImg = {}, pick = null;   // pick = {gi, si|null}
let firstSnap = true, saveTimer = null, writing = Promise.resolve(), dirty = false, cfgWriting = 0;

function dayLayout(day){
  if (day === 6) return [];
  if (day === 7) { const sv = cfg.days && cfg.days[7]; return Array.isArray(sv) && sv[0] && Array.isArray(sv[0].n) ? clone(sv) : [{g:"Вправи", n:[]}]; }
  const saved = cfg.days && cfg.days[day];
  const ok = day !== 7 && Array.isArray(saved) && saved.length === DAYS[day].g.length && saved.every((x,i) => x && x.g === DAYS[day].g[i] && Array.isArray(x.n));
  return ok ? clone(saved) : OLD[1][day].map(([g, n]) => ({g, n:[...n]}));
}
function blank(day, date){
  return {id:`d${day}-${Date.now().toString(36)}`, day, date: date || today(), start:"", end:"", kcal:"", lay:dayLayout(day), ex:{}, bike:{}};
}
function fromDoc(id, d){
  const ex = {};
  (d.ex || []).forEach(e => ex[e.n] = (e.s || []).map(s => ({w:s.w||"", r:s.r||""})));
  const lay = Array.isArray(d.lay) ? clone(d.lay) : (d.week && OLD[d.week] ? (OLD[d.week][d.day] || []).map(([g, n]) => ({g, n:[...n]})) : dayLayout(d.day));
  return {id, week:d.week, day:d.day, date:d.date, start:d.start||"", end:d.end||"", kcal:d.kcal||"", lay, ex, bike:clone(d.bike || {})};
}
function hasData(w){ return !!(w.start || w.end || w.kcal) || Object.values(w.bike || {}).some(Boolean) || Object.values(w.ex).some(s => s.some(x => x.w || x.r)); }
function durText(s, e){
  if (!s || !e) return "";
  const m = t => t[0]*60 + t[1];
  let d = m(e.split(":").map(Number)) - m(s.split(":").map(Number));
  if (d < 0) d += 1440;
  const h = Math.floor(d/60), mm = d % 60;
  return (h ? `${h} год ` : "") + `${mm} хв`;
}
function sorted(){ return Object.entries(all).map(([id,d]) => ({id, ...d})).sort((a,b) => b.date.localeCompare(a.date) || (b.updated||0)-(a.updated||0)); }
function status(t, cls){ const s = $("status"); s.textContent = t; s.className = cls || ""; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function attr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

/* ---------- progression advice (double progression: reps up to the top of the range, then more weight) ---------- */
function range(name){ const t = tgt(name); return {lo: t.lo, hi: t.hi}; }
function step(name){
  const n = name.toLowerCase();
  if (/присідан|жим ногами|станова|румунська|сідничний|нахили вперед/.test(n)) return 10;
  if (/штанг|сміт|жим .*лежачи/.test(n) && !/гантел|блоц|блок|кросовер|розгинан|згинан|french|французьк/.test(n)) return 10;
  return 5;
}
const r5 = v => Math.round(v / 5) * 5 || 5;
function adviceFor(name, before){
  const pv = before !== undefined ? before : (cur ? prevFor(name) : null);
  if (!pv) return null;
  const sets = (pv.s || []).map(x => ({w: parseFloat(x.w) || 0, r: parseInt(x.r) || 0})).filter(x => x.r > 0);
  if (!sets.length) return null;
  const {lo, hi} = range(name), top = Math.max(...sets.map(x => x.w));
  const work = sets.filter(x => x.w === top), inc = step(name), noW = top === 0;
  if (noW) return {kind:"keep", w:0, short:"", text:`Без ваги: ціль ${hi} повторів у кожному підході.`};
  if (work.length >= Math.min(2, sets.length) && work.every(x => x.r >= hi) && sets.length >= 3)
    return {kind:"up", w: top + inc, short:`↑ ${top + inc} lb`, text:`Минулого разу ${top} lb на ${hi}+ повторів. Пора додати: <b>${top + inc} lb</b> (+${inc}), ціль ${lo}–${hi} повторів.`};
  const minR = Math.min(...work.map(x => x.r));
  if (minR < lo - 2 && work.length >= 2)
    return {kind:"down", w: r5(top * 0.9), short:`↓ ${r5(top * 0.9)} lb`, text:`На ${top} lb вийшло лише ${minR} повт. (план ${lo}–${hi}). Зменш до <b>${r5(top * 0.9)} lb</b> і зроби чисто ${lo}+ повторів.`};
  return {kind:"keep", w: top, short:`= ${top} lb`, text:`Залиш <b>${top} lb</b> і додай по 1 повтору. Коли в усіх підходах буде ${hi}, збільшимо вагу на ${inc} lb.`};
}
function readyCount(day){
  const lay = dayLayout(day);
  let n = 0;
  lay.forEach(g => g.n.forEach(name => {
    let best = null;
    Object.values(all).forEach(d => { const e = (d.ex || []).find(e => e.n === name); if (e && e.s.some(x => x.r) && (!best || d.date > best.date)) best = {date:d.date, s:e.s}; });
    const a = best && adviceFor(name, best); if (a && a.kind === "up") n++;
  }));
  return n;
}

/* ---------- start screen ---------- */
function lastOf(day){ return sorted().find(r => r.day === day); }
function suggestion(){
  const strength = sorted().find(r => r.day >= 1 && r.day <= 5);
  return strength ? strength.day % 5 + 1 : 1;
}
function ago(date){
  const d = Math.round((new Date(today()) - new Date(date)) / 864e5);
  return d === 0 ? "сьогодні" : d === 1 ? "вчора" : `${d} дн. тому`;
}
function renderPick(){
  const sug = suggestion();
  $("types").innerHTML = ORDER.concat(6).map(d => {
    const l = lastOf(d);
    const info = d === sug ? "Пропоную сьогодні" : (l ? `Було ${ago(l.date)}` : "Ще не було");
    const up = d <= 5 ? readyCount(d) : 0;
    return `<button class="type${d === sug ? " sug" : ""}${d === 6 ? " bike" : ""}" type="button" data-type="${d}"><b>${DAYS[d].t}</b><small>${info}${up ? ` · ↑ вага у ${up} впр.` : ""}</small></button>`;
  }).join("");
}

/* ---------- workout screen ---------- */
function prevFor(name){
  let best = null;
  for (const [id, d] of Object.entries(all)){
    if (id === cur.id || d.date > cur.date) continue;
    const e = (d.ex || []).find(e => e.n === name);
    if (!e || !e.s.some(s => s.w || s.r)) continue;
    if (!best || d.date > best.date || (d.date === best.date && (d.updated||0) > (best.updated||0))) best = {date:d.date, updated:d.updated, s:e.s};
  }
  return best;
}
function doneCount(name){ return (cur.ex[name] || []).filter(s => s.w || s.r).length; }
function slotName(key){ const [gi, si] = key.split("-").map(Number); return cur.lay[gi].n[si]; }
function keys(){ const k = []; cur.lay.forEach((g, gi) => g.n.forEach((_, si) => k.push(`${gi}-${si}`))); return k; }
function firstOpen(){ return keys().find(k => doneCount(slotName(k)) < setsFor(slotName(k))) || null; }
function setsOf(name){ const a = cur.ex[name] || (cur.ex[name] = []); while (a.length < setsFor(name)) a.push({w:"", r:""}); return a; }

function renderHeader(){
  const work = !!cur;
  $("backBtn").hidden = !work;
  $("dateWrap").hidden = !work;
  $("title").textContent = work ? DAYS[cur.day].t : "Щоденник тренувань";
  if (work){
    $("date").value = cur.date;
    $("dateLbl").textContent = cur.date === today() ? `сьогодні, ${fmtDate(cur.date).slice(0,5)}` : fmtDate(cur.date);
  }
}
function renderSession(){
  $("start").value = cur.start; $("end").value = cur.end; $("kcal").value = cur.kcal;
  updDur();
}
function updDur(){
  const d = durText(cur.start, cur.end);
  $("dur").innerHTML = d ? `Тривалість: <b>${d}</b>` : (cur.start ? `Почав о <b>${cur.start}</b>` : "Час можна виправити вручну в полях вище");
  const g = $("goBtn");
  g.hidden = !!(cur.start && cur.end);
  g.textContent = cur.start ? "■ Закінчити тренування" : "▶ Почати тренування";
  g.classList.toggle("stop", !!cur.start);
}
function renderBike(){
  const isBike = cur.day === 6;
  $("bikeBox").hidden = !isBike;
  if (!isBike) return;
  const b = cur.bike || {};
  [["bmin","min"],["bkm","km"],["blvl","lvl"],["bhr","hr"]].forEach(([id,k]) => { if (document.activeElement !== $(id)) $(id).value = b[k] || ""; });
  const prev = sorted().find(r => r.day === 6 && r.id !== cur.id && r.date <= cur.date);
  const pb = prev && prev.bike || {};
  $("bikePrev").textContent = prev ? `Минулого разу (${fmtDate(prev.date).slice(0,5)}): ${pb.min || "–"} хв, ${pb.km || "–"} км${pb.lvl ? `, рівень ${pb.lvl}` : ""}${prev.kcal ? `, ${prev.kcal} ккал` : ""}` : "Ккал впиши вгорі, в полі «Ккал».";
}
function renderList(){
  if (cur.day === 6){ $("list").innerHTML = ""; return; }
  let html = "", n = 0;
  const ks = keys();
  cur.lay.forEach((grp, gi) => {
    html += `<div class="group"><span>${esc(gl(grp.g))}</span></div>`;
    grp.n.forEach((name, si) => {
      n++;
      const key = `${gi}-${si}`, open = key === openKey;
      const vals = cur.ex[name] || [];
      const pv = prevFor(name);
      const dc = doneCount(name);
      const prevShort = pv ? pv.s.filter(s=>s.w||s.r).map(s => `${s.w||"–"}×${s.r||"–"}`).join(", ") : "";
      const adv = adviceFor(name);
      const sub = pv ? `Мин. раз: ${esc(prevShort)}${adv && adv.short ? ` · <b class="adv-${adv.kind}">${adv.short}</b>` : ""}` : `Ціль ${tgtText(name)}`;
      html += `<div class="ex${open ? " open" : ""}"><button class="exhead" type="button" data-tog="${key}" aria-expanded="${open}"><span class="nm">${n}. ${esc(name)}${open ? "" : `<small>${sub}</small>`}</span><span class="badge${dc >= setsFor(name) ? " done" : dc ? " part" : ""}">${dc >= setsFor(name) ? "✓" : `${dc}/${setsFor(name)}`}</span></button>`;
      if (open){
        let rows = "";
        for (let i=0;i<Math.max(setsFor(name), vals.length);i++){
          const v = vals[i] || {}, p = pv && pv.s[i] ? pv.s[i] : {};
          const cell = (k, lbl) => `<div class="cell"><span>${lbl}</span><input id="${cur.id}-${key}-${k}${i}" data-n="${attr(name)}" data-i="${i}" data-k="${k}" inputmode="${k==="w"?"decimal":"numeric"}" autocomplete="off" aria-label="Підхід ${i+1}, ${k==="w"?"вага lb":"повтори"}" value="${attr(v[k]||"")}" placeholder="${attr(p[k]||"")}" class="${v[k]?"filled":""}"></div>`;
          rows += `<div class="setrow"><span class="no">${i+1}</span>${cell("w","lb")}<span class="x">×</span>${cell("r","повт")}<button class="same" type="button" data-same="${key}" data-i="${i}" ${p.w||p.r ? "" : "disabled"} aria-label="Підхід ${i+1} як минулого разу">як<br>мин.</button></div>`;
        }
        const nextKey = ks[ks.indexOf(key)+1];
        html += `<div class="exbody">
          ${tgtEdit === name ? `<div class="tgtbox"><b>Моя ціль для цієї вправи</b>
            <div class="tgtrow"><label>Підходів<input id="tgS" inputmode="numeric" value="${tgt(name).sets}"></label><label>Повторів від<input id="tgL" inputmode="numeric" value="${tgt(name).lo}"></label><label>до<input id="tgH" inputmode="numeric" value="${tgt(name).hi}"></label></div>
            <div class="tools"><button class="tool acc" type="button" data-tgtsave="${attr(name)}">Зберегти</button>${tgt(name).own ? `<button class="tool" type="button" data-tgtreset="${attr(name)}">Як у плані${PLAN[name] ? ` (${esc(PLAN[name])})` : ""}</button>` : ""}<button class="tool" type="button" data-tgtcancel="1">Скасувати</button></div>
            <p class="plan">Порада по вазі рахується від цієї цілі: коли в усіх підходах зробиш верхню цифру, застосунок запропонує додати вагу.</p></div>`
          : `<div class="plan">Ціль: <b>${tgtText(name)}</b>${tgt(name).own ? " (моя)" : ""} <button class="tgtbtn" type="button" data-tgt="${attr(name)}">змінити</button>${pv ? ` · минулого разу ${fmtDate(pv.date).slice(0,5)}` : ""}</div>`}
          ${adv ? `<div class="advice ${adv.kind}"><span>${adv.kind === "up" ? "Порада: збільш вагу" : adv.kind === "down" ? "Порада: зменш вагу" : "Порада"}</span><p style="margin:0">${adv.text}</p>${adv.w ? `<button class="tool acc" type="button" data-advw="${attr(name)}" data-w="${adv.w}">Поставити ${adv.w} lb у всі підходи</button>` : ""}</div>` : (PLAN[name] ? "" : `<div class="advice keep"><span>Порада</span>Перше тренування з цією вправою: підбери вагу, з якою робиш 8–12 повторів з запасом 1–2.</div>`)}
          <div class="sets">${rows}</div>
          <div class="tools">
            ${pv ? `<button class="tool acc" type="button" data-copy="${attr(name)}">Усі як минулого разу</button>` : ""}
            ${IMG[name] ? `<button class="tool" type="button" data-img="${key}">${showImg[key] ? "Сховати техніку" : "Техніка"}</button>` : ""}
            <button class="tool" type="button" data-chg="${key}">Замінити вправу</button>
            ${grp.n.length > 1 ? `<button class="tool red" type="button" data-rm="${key}">Прибрати</button>` : ""}
          </div>
          ${showImg[key] && IMG[name] ? `<img class="how" decoding="async" src="img/${IMG[name]}.jpg" alt="Техніка: ${attr(name)}, зліва початок руху, справа кінець">` : ""}
          ${nextKey ? `<button class="next" type="button" data-tog="${nextKey}">Наступна вправа ›</button>` : ""}
        </div>`;
      }
      html += `</div>`;
    });
    html += `<button class="addex" type="button" data-addg="${gi}">＋ Додати вправу: ${esc(gl(grp.g).toLowerCase())}</button>`;
  });
  $("list").innerHTML = html;
}
function refreshBadge(name){
  const key = keys().find(k => slotName(k) === name);
  const head = document.querySelector(`.exhead[data-tog="${key}"] .badge`);
  if (!head) return;
  const dc = doneCount(name);
  head.className = "badge" + (dc >= setsFor(name) ? " done" : dc ? " part" : "");
  head.textContent = dc >= setsFor(name) ? "✓" : `${dc}/${setsFor(name)}`;
}
function renderHist(){
  const rows = sorted().slice(0, 15);
  $("histEmpty").hidden = rows.length > 0;
  $("hist").innerHTML = rows.map(r => `<li><button type="button" data-open="${attr(r.id)}" class="${cur && r.id===cur.id?"cur":""}"><span>${(DAYS[r.day] || {t:"Тренування"}).t}</span><span>${fmtDate(r.date)}${r.kcal ? ` · ${esc(r.kcal)} ккал` : ""}</span></button></li>`).join("");
}
function render(){
  renderHeader();
  $("vPick").hidden = !!cur; $("vWork").hidden = !cur;
  if (!cur){ renderPick(); renderHist(); return; }
  if (openKey == null) openKey = firstOpen();
  renderSession(); renderBike(); renderList();
  const saved = !!all[cur.id];
  $("delBtn").hidden = !saved; $("delYes").hidden = true; $("delNo").hidden = true;
  renderHist();
}
function resetView(){ openKey = null; showImg = {}; }

/* ---------- exercise picker ---------- */
function openPicker(gi, si){
  pick = {gi, si};
  const g = cur.lay[gi].g, curName = si == null ? null : cur.lay[gi].n[si];
  const used = new Set(cur.lay.flatMap(x => x.n));
  const names = [...LIB[g]];
  ((cfg.custom || {})[g] || []).forEach(n => { if (!names.includes(n)) names.push(n); });
  $("shTitle").textContent = si == null ? `Додати: ${gl(g).toLowerCase()}` : `Замінити вправу`;
  $("shBody").innerHTML = `<div class="customrow"><input id="cname" maxlength="80" placeholder="Своя вправа: впиши назву" autocomplete="off" enterkeyhint="done"><button class="btn primary" type="button" data-cadd="1">Додати</button></div>`
    + names.map(n => {
      const isCur = n === curName, dis = !isCur && used.has(n);
      return optHtml(n, isCur, dis);
    }).join("")
    + `<p class="plan" style="margin:14px 2px 4px">Інші групи м'язів: можна додати будь-яку вправу в це тренування</p>`
    + Object.keys(LIB).filter(x => x !== g && x !== "Вправи").map(x => `<details class="ogrp"><summary>${esc(gl(x))} <small>${LIB[x].length}</small></summary>${LIB[x].map(n => optHtml(n, n === curName, n !== curName && used.has(n))).join("")}</details>`).join("");
  $("sheet").hidden = false; document.body.style.overflow = "hidden"; $("shBody").scrollTop = 0;
}
function optHtml(n, isCur, dis){
  return `<button class="opt${isCur ? " cur" : ""}" type="button" data-pickn="${attr(n)}" ${dis ? "disabled" : ""}>${IMG[n] ? `<img loading="lazy" decoding="async" src="img/${IMG[n]}.jpg" alt="">` : `<span class="noimg"></span>`}<span><b>${esc(n)}</b><small>${isCur ? "зараз у тренуванні" : dis ? "вже є в цьому тренуванні" : (PLAN[n] || (cfg.targets || {})[n] ? tgtText(n) : "своя вправа")}</small></span></button>`;
}
function closePicker(){ $("sheet").hidden = true; document.body.style.overflow = ""; pick = null; }
function applyPick(name){
  if (!pick) return;
  const {gi, si} = pick, grp = cur.lay[gi];
  if (si == null){ grp.n.push(name); openKey = `${gi}-${grp.n.length - 1}`; }
  else {
    const old = grp.n[si];
    if (name !== old){ delete cur.ex[old]; grp.n[si] = name; }
    openKey = `${gi}-${si}`;
  }
  rememberLayout();
  closePicker(); render();
  if (all[cur.id] || hasData(cur)) scheduleSave();
}
function addCustom(){
  const inp = $("cname"); if (!inp) return;
  const name = inp.value.replace(/\s+/g, " ").trim().slice(0, 80);
  if (!name) { inp.focus(); return; }
  if (cur.lay.some(x => x.n.includes(name))) { status("Ця вправа вже є в тренуванні", "err"); inp.focus(); return; }
  const g = cur.lay[pick.gi].g;
  cfg.custom = cfg.custom || {};
  const list = cfg.custom[g] || (cfg.custom[g] = []);
  if (!LIB[g].includes(name) && !list.includes(name)) list.push(name);
  applyPick(name);
}
function rememberLayout(){
  if (cur.day === 6) return;
  cfg.days = cfg.days || {};
  cfg.days[cur.day] = clone(cur.lay);
  saveCfg();
}
function saveCfg(){
  if (!cfgRef) return;
  cfgWriting++;
  const data = clone(cfg);
  writing = writing.then(() => cfgRef.set(data)).catch(() => status("Не вдалося зберегти вибір вправ", "err")).finally(() => cfgWriting--);
}

/* ---------- saving (same format as before, plus bike) ---------- */
function scheduleSave(){
  dirty = true;
  clearTimeout(saveTimer);
  status(db ? "Зберігаю…" : "Немає з'єднання, дані не збережуться", db ? "" : "err");
  saveTimer = setTimeout(save, 700);
}
function save(){
  saveTimer = null;
  if (!col || !cur) return;
  const w = cur;
  if (!hasData(w) && !all[w.id]) { dirty = false; status("Готово"); return; }
  const doc = {day:w.day, date:w.date, start:w.start, end:w.end, kcal:w.kcal, updated:Date.now(), lay:clone(w.lay),
    ex: Object.entries(w.ex).map(([n,s]) => ({n, s:s.map(x => ({w:x.w, r:x.r}))}))};
  if (w.week) doc.week = w.week;
  if (w.day === 6) doc.bike = clone(w.bike || {});
  all[w.id] = doc;
  writing = writing.then(() => col.doc(w.id).set(doc)).then(() => {
    if (w === cur) { dirty = false; status("Збережено ✓", "ok"); if ($("delYes").hidden) $("delBtn").hidden = false; renderHist(); }
  }).catch(e => status(e && e.code === "invalid_argument" ? "Немає прав на запис" : "Не вдалося зберегти, спробуйте ще", "err"));
}
function flush(){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; if (dirty) save(); } }

function startType(day){
  const t = today();
  const same = sorted().find(r => r.day === day && r.date === t);
  cur = same ? fromDoc(same.id, same) : blank(day, t);
  resetView(); render(); window.scrollTo(0,0);
}

document.addEventListener("click", e => {
  const b = e.target.closest("button, [data-close]"); if (!b) return;
  const ds = b.dataset;
  if (ds.close) return closePicker();
  if (ds.type) return startType(+ds.type);
  if (ds.open){ flush(); cur = fromDoc(ds.open, all[ds.open]); resetView(); render(); window.scrollTo(0,0); return; }
  if (ds.pickn) return applyPick(ds.pickn);
  if (ds.cadd) return addCustom();
  if (ds.tog){
    const k = ds.tog;
    openKey = openKey === k && b.classList.contains("exhead") ? "" : k;
    renderList();
    if (openKey) document.querySelector(`.exhead[data-tog="${openKey}"]`)?.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    return;
  }
  if (ds.same){
    const name = slotName(ds.same), pv = prevFor(name), i = +ds.i;
    if (!pv || !pv.s[i]) return;
    setsOf(name)[i] = {w: pv.s[i].w || "", r: pv.s[i].r || ""};
    renderList(); scheduleSave(); return;
  }
  if (ds.copy){
    const pv = prevFor(ds.copy); if (!pv) return;
    cur.ex[ds.copy] = Array.from({length:Math.max(setsFor(ds.copy), pv.s.length)}, (_,i) => ({w:(pv.s[i]||{}).w||"", r:(pv.s[i]||{}).r||""}));
    renderList(); scheduleSave(); return;
  }
  if (ds.advw){
    const arr = setsOf(ds.advw);
    arr.forEach(x => { x.w = ds.w; });
    renderList(); scheduleSave(); return;
  }
  if (ds.tgt){ tgtEdit = ds.tgt; renderList(); return; }
  if (ds.tgtcancel){ tgtEdit = null; renderList(); return; }
  if (ds.tgtsave){
    const n = v => parseInt(($(v) || {}).value, 10);
    let sets = n("tgS"), lo = n("tgL"), hi = n("tgH");
    if (!(lo > 0)) { $("tgL").focus(); return; }
    if (!(hi >= lo)) hi = lo;
    sets = Math.min(8, Math.max(1, sets || SETS));
    cfg.targets = cfg.targets || {}; cfg.targets[ds.tgtsave] = {sets, lo: Math.min(lo, 100), hi: Math.min(hi, 100)};
    saveCfg(); tgtEdit = null; renderList(); return;
  }
  if (ds.tgtreset){ if (cfg.targets) delete cfg.targets[ds.tgtreset]; saveCfg(); tgtEdit = null; renderList(); return; }
  if (ds.img){ showImg[ds.img] = !showImg[ds.img]; renderList(); return; }
  if (ds.chg){ const [gi, si] = ds.chg.split("-").map(Number); return openPicker(gi, si); }
  if (ds.addg != null){ return openPicker(+ds.addg, null); }
  if (ds.rm){
    const [gi, si] = ds.rm.split("-").map(Number);
    const name = cur.lay[gi].n[si];
    if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Точно прибрати?"; return; }
    cur.lay[gi].n.splice(si, 1); delete cur.ex[name]; openKey = null;
    rememberLayout(); render(); if (all[cur.id] || hasData(cur)) scheduleSave(); return;
  }
  switch (b.id){
    case "backBtn": flush(); cur = null; render(); window.scrollTo(0,0); return;
    case "goBtn": if (!cur.start) cur.start = nowHM(); else cur.end = nowHM(); renderSession(); scheduleSave(); return;
    case "delBtn": $("delBtn").hidden = true; $("delYes").hidden = false; $("delNo").hidden = false; return;
    case "delNo": $("delBtn").hidden = false; $("delYes").hidden = true; $("delNo").hidden = true; return;
    case "delYes": {
      clearTimeout(saveTimer); saveTimer = null; dirty = false;
      const id = cur.id; delete all[id];
      if (col) writing = writing.then(() => col.doc(id).delete()).then(() => status("Видалено", "ok")).catch(() => status("Не вдалося видалити", "err"));
      cur = null; render(); return;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "cname"){ e.preventDefault(); addCustom(); }
  if (e.key === "Escape" && !$("sheet").hidden) closePicker();
});
document.addEventListener("input", e => {
  const t = e.target;
  if (!cur) return;
  if (t.id === "date"){ if (t.value){ cur.date = t.value; renderHeader(); renderList(); renderBike(); scheduleSave(); } return; }
  if (t.id === "start" || t.id === "end"){ cur[t.id] = t.value; updDur(); scheduleSave(); return; }
  if (t.id === "kcal"){ const v = t.value.replace(/\D/g, ""); if (v !== t.value) t.value = v; cur.kcal = v; scheduleSave(); return; }
  const bk = {bmin:"min", bkm:"km", blvl:"lvl", bhr:"hr"}[t.id];
  if (bk){ const v = t.value.replace(",", ".").replace(bk === "km" ? /[^\d.]/g : /\D/g, ""); if (v !== t.value) t.value = v; cur.bike = cur.bike || {}; cur.bike[bk] = v; scheduleSave(); return; }
  if (!t.dataset.n) return;
  const v = t.value.replace(",", ".").replace(/[^\d.]/g, "");
  if (v !== t.value) t.value = v;
  t.classList.toggle("filled", !!v);
  setsOf(t.dataset.n)[+t.dataset.i][t.dataset.k] = v;
  refreshBadge(t.dataset.n);
  scheduleSave();
});
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });

render();

(async () => {
  try { db = await window.claude?.use?.("db"); } catch { db = null; }
  if (!db){ status("Немає з'єднання, дані не збережуться", "err"); return; }
  col = db.collection("workouts");
  cfgRef = db.doc("config/main");
  status("Завантаження…");
  let cfgReady = false, wReady = false;
  const boot = () => {
    if (!firstSnap || !cfgReady || !wReady) return;
    firstSnap = false;
    if (!cur){ const t = sorted().find(r => r.date === today()); if (t) cur = fromDoc(t.id, t); }
    render();
    status("Готово");
  };
  cfgRef.onSnapshot(snap => {
    if (cfgWriting) return;
    cfg = snap.exists ? Object.assign({days:{}, custom:{}}, snap.data()) : {days:{}, custom:{}};
    if (!cfgReady){ cfgReady = true; boot(); return; }
    if (cur && !all[cur.id] && !hasData(cur) && !pick){ cur.lay = dayLayout(cur.day); renderList(); }
  }, () => { cfgReady = true; boot(); });
  col.onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); });
    if (dirty && cur && all[cur.id]) next[cur.id] = all[cur.id];
    all = next;
    if (!wReady){ wReady = true; boot(); return; }
    const busy = ["INPUT","SELECT"].includes(document.activeElement?.tagName) || pick;
    if (cur && !dirty && all[cur.id] && !busy){ cur = fromDoc(cur.id, all[cur.id]); render(); }
    else if (!cur) render();
    else renderHist();
  }, () => status("Немає зв'язку з базою", "err"));
})();
/* ---------- backup / transfer ---------- */
(function(){
  const APP = "gym";
  const inApp = !!window.APPDB;
  const el = id => document.getElementById(id);
  el("bkApp").hidden = !inApp; el("bkClaude").hidden = inApp; el("bkPasteBox").hidden = !inApp;
  el("bkInfo").textContent = inApp
    ? "Записи зберігаються на цьому телефоні. Раз на тиждень зберігай копію у файл. Надішли файл Claude, якщо хочеш, щоб він проаналізував твої результати."
    : "Ця кнопка копіює всі записи, щоб перенести їх у застосунок на телефоні: відкрий застосунок, вкладка з записами, встав і натисни «Перенести записи».";
  const msg = t => { el("bkMsg").textContent = t; };
  const pack = () => JSON.stringify({app: APP, v: 1, at: new Date().toISOString(), docs: (() => { const o = {}; Object.entries(all).forEach(([id, d]) => o["workouts/" + id] = d); o["config/main"] = cfg; return o; })()});
  const fname = () => `${APP === "food" ? "kalorii" : "trenuvannia"}-${new Date().toISOString().slice(0,10)}.json`;
  el("bkCopy").addEventListener("click", () => {
    const t = pack();
    const done = () => msg(`Скопійовано (${Object.keys(JSON.parse(t).docs).length} записів). Тепер відкрий застосунок і встав.`);
    try { navigator.clipboard.writeText(t).then(done, () => fallback(t)); } catch (e) { fallback(t); }
  });
  function fallback(t){ el("bkPasteBox").hidden = false; el("bkPaste").value = t; el("bkPaste").select(); msg("Виділи весь текст вище і скопіюй його вручну."); }
  if (!inApp) return;
  el("bkSave").addEventListener("click", () => {
    const blob = new Blob([pack()], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname(); document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); msg("Файл збережено в «Завантаження».");
  });
  el("bkShare").addEventListener("click", async () => {
    try {
      const file = new File([pack()], fname(), {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: fname()}); msg("Готово."); }
      else el("bkSave").click();
    } catch (e) { if (e && e.name !== "AbortError") msg("Не вдалося надіслати, збережи у файл."); }
  });
  async function doImport(text){
    let o; try { o = JSON.parse(text); } catch (e) { msg("Це не схоже на записи щоденника. Скопіюй ще раз."); return; }
    if (!o || o.app !== APP || !o.docs) { msg(APP === "food" ? "Це записи не з щоденника калорій." : "Це записи не з щоденника тренувань."); return; }
    const n = await window.APPDB.importDocs(o.docs);
    msg(`Перенесено ${n} записів.`); setTimeout(() => location.reload(), 800);
  }
  el("bkImport").addEventListener("click", () => doImport(el("bkPaste").value.trim()));
  el("bkFile").addEventListener("change", e => { const f = e.target.files[0]; if (!f) return; f.text().then(doImport); e.target.value = ""; });
})();
</script>
